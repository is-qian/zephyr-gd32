# GD32 power-board firmware: manual build + dated release.
# Trigger: Actions -> firmware -> Run workflow.

name: firmware

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Pinned for reproducible builds; bump together with the local workspace.
  ZEPHYR_REV: "9a6008dfafc339fedd3a47611adc2fbc58c19027"
  HAL_REV: "e6008175412e978433a9a995bbf86382056084f2"

jobs:
  build-release:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install git (needed by checkout inside the container)
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          apt-get install -y -qq --no-install-recommends python3 python3-pip cmake ninja-build device-tree-compiler gcc-arm-none-eabi
          pip3 install --break-system-packages --quiet west

      - name: Fetch Zephyr workspace
        run: |
          west init -m https://github.com/GD32-MCU-IOT/gd32_zephyr zephyrproject
          git -C zephyrproject/zephyr checkout "$ZEPHYR_REV"
          cd zephyrproject
          west update --narrow cmsis cmsis_6 hal_gigadevice
          git -C modules/hal/gigadevice checkout "$HAL_REV"

      - name: Apply fork patches
        run: |
          git -C zephyrproject/zephyr apply patches/gd32_zephyr/*.patch
          git -C zephyrproject/modules/hal/gigadevice apply patches/hal_gigadevice_zephyr/*.patch

      - name: Build firmware
        run: |
          pip3 install --break-system-packages --quiet -r zephyrproject/zephyr/scripts/requirements-base.txt
          cd zephyrproject
          ZEPHYR_TOOLCHAIN_VARIANT=gnuarmemb GNUARMEMB_TOOLCHAIN_PATH=/usr \
            west build -b gd32c231f8_dk "$GITHUB_WORKSPACE" -d "$GITHUB_WORKSPACE/build" -p always
          mv "$GITHUB_WORKSPACE/build/zephyr/zephyr.bin" \
             "$GITHUB_WORKSPACE/build/zephyr/zephyr.hex" \
             "$GITHUB_WORKSPACE/build/zephyr/zephyr.elf" "$GITHUB_WORKSPACE/"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-firmware
          path: |
            zephyr.bin
            zephyr.hex
            zephyr.elf

      - name: Compute release name/tag
        id: rel
        run: |
          echo "name=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"
          echo "tag=fw-$(TZ=Asia/Shanghai date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.rel.outputs.name }}
          tag_name: ${{ steps.rel.outputs.tag }}
          body: GD32 power-board firmware, commit ${{ github.sha }}
          files: |
            zephyr.bin
            zephyr.hex
            zephyr.elf
